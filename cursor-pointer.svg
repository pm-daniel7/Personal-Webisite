<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="p-tip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00BBF9"/>
    </linearGradient>
    <linearGradient id="p-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE440"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>
    <linearGradient id="p-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5400"/>
      <stop offset="100%" stop-color="#FF0054"/>
    </linearGradient>
    <linearGradient id="p-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#9B5DE5"/>
    </linearGradient>
    <linearGradient id="p-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7209B7"/>
      <stop offset="100%" stop-color="#3A0CA3"/>
    </linearGradient>
    <linearGradient id="p-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <filter id="p-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.75" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#p-shadow)" stroke="#FFFFFF" stroke-width="0.65" stroke-linejoin="round" stroke-linecap="round">
    <!-- Pointing Crystal Index Finger (Hotspot at 7, 0) -->
    <!-- Finger Tip Lead Facet -->
    <polygon points="7,1 11,5 6,8" fill="url(#p-tip)" />
    <!-- Finger Upper Ridge -->
    <polygon points="7,1 12,3 11,5" fill="url(#p-gold)" />
    <!-- Finger Shaft Left -->
    <polygon points="6,8 11,5 10,13 5,12" fill="url(#p-cyan)" />
    <!-- Finger Shaft Right -->
    <polygon points="11,5 14,7 13,13 10,13" fill="url(#p-magenta)" />
    
    <!-- Thumb Crystal Facet -->
    <polygon points="2,12 5,12 4,16 1,15" fill="url(#p-coral)" />
    
    <!-- Palm Core Crystalline Facets -->
    <polygon points="5,12 10,13 8,18 4,16" fill="url(#p-coral)" />
    <polygon points="10,13 15,13 14,19 8,18" fill="url(#p-magenta)" />
    <polygon points="14,7 17,9 18,14 15,13" fill="url(#p-gold)" />
    
    <!-- Knuckle / Right Side Facets -->
    <polygon points="15,13 18,14 16,19 14,19" fill="url(#p-violet)" />
    <polygon points="8,18 14,19 12,23 7,21" fill="url(#p-violet)" />
    
    <!-- Trailing Shattered Crystal Shards (Breaking the Prism) -->
    <!-- Shard 1: Gold shard floating upper-right -->
    <polygon points="21,5 24,7 22,9" fill="url(#p-gold)" />
    
    <!-- Shard 2: Magenta triangular shard floating right -->
    <polygon points="20,13 23,15 21,17" fill="url(#p-magenta)" />
    
    <!-- Shard 3: Cyan crystal shard floating below wrist -->
    <polygon points="14,23 18,25 15,27" fill="url(#p-cyan)" />
    
    <!-- Shard 4: Ruby shard floating lower-left -->
    <polygon points="3,21 6,24 2,24" fill="url(#p-coral)" />
    
    <!-- Shard 5: Micro-spark -->
    <polygon points="22,21 24,22 23,24" fill="url(#p-tip)" stroke-width="0.5"/>
  </g>
</svg>
