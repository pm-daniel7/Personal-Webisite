    <!-- Immediate theme restore & clean URL -->
    <script>
        (function() {
            try {
                if (window.location.pathname.endsWith("/index.html") || window.location.pathname === "/index.html") {
                    window.history.replaceState(null, "", window.location.pathname.replace(/\/index\.html$/, "/") || "/");
                } else if (window.location.pathname.endsWith(".html")) {
                    window.history.replaceState(null, "", window.location.pathname.replace(/\.html$/, ""));
                }
            } catch (e) {}

            try {
                var stored = localStorage.getItem('theme');
                if (stored && ['1','2','3','4','5','6','7','8','9'].indexOf(stored) !== -1) {
                    document.documentElement.setAttribute('data-theme', stored);
                } else {
                    document.documentElement.setAttribute('data-theme', '6');
                }
            } catch(e) {}
        })();
    </script>
