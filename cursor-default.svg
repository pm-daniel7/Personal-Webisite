<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Prismatic gradients for luminous crystal facets -->
    <linearGradient id="facet-tip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00BBF9"/>
    </linearGradient>
    <linearGradient id="facet-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE440"/>
      <stop offset="100%" stop-color="#FF9E00"/>
    </linearGradient>
    <linearGradient id="facet-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5400"/>
      <stop offset="100%" stop-color="#FF0054"/>
    </linearGradient>
    <linearGradient id="facet-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#9B5DE5"/>
    </linearGradient>
    <linearGradient id="facet-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7209B7"/>
      <stop offset="100%" stop-color="#3A0CA3"/>
    </linearGradient>
    <linearGradient id="facet-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <filter id="prism-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.75" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#prism-shadow)" stroke="#FFFFFF" stroke-width="0.65" stroke-linejoin="round" stroke-linecap="round">
    <!-- Main Low-Poly Crystalline Arrowhead -->
    <!-- Tip Primary Leading Facet (Turquoise -> Cyan) -->
    <polygon points="1,1 11,11 2,16" fill="url(#facet-tip)" />
    
    <!-- Top Ridge Facet (Gold -> Amber) -->
    <polygon points="1,1 17,9 11,11" fill="url(#facet-gold)" />
    
    <!-- Inner Spine Core (Magenta -> Violet) -->
    <polygon points="11,11 17,9 15,16 11,15" fill="url(#facet-magenta)" />
    
    <!-- Left Barb Wing (Coral -> Ruby) -->
    <polygon points="2,16 11,11 8,20" fill="url(#facet-coral)" />
    
    <!-- Right Barb Facet (Violet -> Deep Indigo) -->
    <polygon points="11,15 15,16 13,20" fill="url(#facet-violet)" />
    
    <!-- Trailing Shattered Crystal Shards (Breaking the Prism) -->
    <!-- Shard 1: Amber/Gold fragment -->
    <polygon points="20,11 23,13 21,15" fill="url(#facet-gold)" />
    
    <!-- Shard 2: Magenta triangular shard -->
    <polygon points="17,19 21,21 18,23" fill="url(#facet-magenta)" />
    
    <!-- Shard 3: Cyan micro-crystal -->
    <polygon points="10,23 13,26 9,26" fill="url(#facet-cyan)" />
    
    <!-- Shard 4: Distant Violet shard -->
    <polygon points="24,19 27,21 25,23" fill="url(#facet-violet)" />
    
    <!-- Shard 5: Tiny floating spark -->
    <polygon points="20,26 22,27 21,29" fill="url(#facet-tip)" stroke-width="0.5"/>
  </g>
</svg>
